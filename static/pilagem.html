<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Painel de Pilagem</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

body {
    margin: 0;
    padding: 24px;
    background: #f4f6f8;
}

h2 {
    text-align: center;
    color: #92400e;
    margin-bottom: 10px;
}

.top-actions {
    max-width: 500px;
    margin: 0 auto 30px;
    display: flex;
    gap: 12px;
}

.top-actions a button {
    flex: 1;
    padding: 14px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    font-weight: 600;
    color: white;
}

.btn-dashboard {
    background: #3b82f6;
}

.btn-secador {
    background: #16a34a;
}

.container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 22px;
    margin-top: 20px;
}

.card {
    background: white;
    border-radius: 22px;
    padding: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,.08);
    position: relative;
}

.card.pronto {
    border-left: 6px solid #f59e0b;
    background: #fffbeb;
}

.card.em-pilagem {
    border-left: 6px solid #6366f1;
    background: #eef2ff;
}

.badge {
    position: absolute;
    top: 14px;
    right: 14px;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
}

.badge-pronto {
    background: #f59e0b;
    color: #78350f;
}

.badge-pilagem {
    background: #6366f1;
    color: white;
}

.card p {
    margin: 6px 0;
    font-size: 14px;
}

.card strong {
    color: #1f2937;
}

button {
    width: 100%;
    padding: 12px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    font-weight: 600;
    margin-top: 10px;
}

.btn-iniciar {
    background: #92400e;
    color: white;
}

.btn-finalizar {
    background: #4f46e5;
    color: white;
}

button:hover {
    opacity: .9;
}
</style>
</head>

<body>

<h2>🟤 Painel de Pilagem</h2>

<div class="top-actions">
    <a href="/dashboard">
        <button class="btn-dashboard">🏠 Dashboard</button>
    </a>
    <a href="/secador">
        <button class="btn-secador">🔥 Painel do Secador</button>
    </a>
</div>

<div class="container">

<!-- CARD – PRONTO PARA PILAGEM -->
<div class="card pronto">
    <span class="badge badge-pronto">PRONTO</span>

    <p><strong>Cliente:</strong> João Silva</p>
    <p><strong>Fazenda:</strong> Santa Luzia</p>
    <p><strong>Peso (coco):</strong> 18.000 kg</p>
    <p><strong>Sacas:</strong> 180</p>
    <p><strong>Grau:</strong> 78.5</p>
    <p><strong>Rolo:</strong> Rolo 3</p>

    <button class="btn-iniciar">Iniciar Pilagem</button>
</div>

<!-- CARD – EM PILAGEM -->
<div class="card em-pilagem">
    <span class="badge badge-pilagem">EM PILAGEM</span>

    <p><strong>Cliente:</strong> Maria Costa</p>
    <p><strong>Fazenda:</strong> Boa Esperança</p>
    <p><strong>Peso (coco):</strong> 28.000 kg</p>
    <p><strong>Sacas:</strong> 280</p>
    <p><strong>Grau:</strong> 80.2</p>
    <p><strong>Rolo:</strong> Rolo 8</p>
    <p><strong>Iniciado por:</strong> admin</p>

    <button class="btn-finalizar">Finalizar Pilagem</button>
</div>

</div>

</body>
</html>
